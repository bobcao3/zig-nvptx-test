name: Build compiler releases

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.revision.outputs.revision }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Resolve compiler source revision
        id: revision
        run: scripts/release.sh source

  linux:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      SOURCE_REVISION: ${{ needs.source.outputs.revision }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Download compiler source and pinned bootstrap toolchain
        run: scripts/release.sh linux-download
      - name: Build and package the Linux compiler and library
        run: scripts/release.sh linux-build
      - name: Verify the relocated Linux package
        run: scripts/release.sh linux-check
      - name: Upload Linux package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zig-linux
          path: zig-nvptx-x86_64-linux-musl-x86_64_v3.tar.xz
          if-no-files-found: error
          compression-level: 0

  macos-build:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      SOURCE_REVISION: ${{ needs.source.outputs.revision }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Download compiler source and build toolchains
        run: scripts/release.sh macos-download
      - name: Cross-compile and package the macOS compiler and library
        run: scripts/release.sh macos-build
      - name: Upload macOS package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zig-macos
          path: zig-nvptx-aarch64-macos-none-apple_m1.tar.xz
          if-no-files-found: error
          compression-level: 0

  macos-test:
    needs: macos-build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Download macOS package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: zig-macos
          path: packages
      - name: Verify the relocated macOS package
        run: scripts/release.sh macos-check

  release:
    needs: [source, linux, macos-build, macos-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Download packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: zig-*
          merge-multiple: true
          path: packages
      - name: Publish release
        run: scripts/release.sh publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_REVISION: ${{ needs.source.outputs.revision }}
          FORGEJO_SSH_KEY: ${{ secrets.FORGEJO_RELEASE_SSH_KEY }}
          FORGEJO_HOST_KEY: ${{ vars.FORGEJO_SSH_HOST_KEY }}
