name: Build compiler releases

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.revision.outputs.revision }}
    steps:
      - name: Resolve compiler source revision
        id: revision
        shell: bash
        run: |
          set -euo pipefail
          revision=$(git ls-remote https://forge.bc3.moe/bob/zig-nvptx.git refs/heads/nvptx | cut -f1)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

  build:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-linux-musl
            cpu: x86_64_v3
            sha256: 3d59a8b9ac5ed3c1a046e550f35b5fb89cb5cd5ebf177cdf1ca00ad8150994e1
          - runner: macos-14
            target: aarch64-macos-none
            cpu: apple_m1
            sha256: 5daddeaad6e135ae4bd09d6c2b4c5a30873b58d10671c13fb8ac1af246df05e6
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      SOURCE_REVISION: ${{ needs.source.outputs.revision }}
      TARGET: ${{ matrix.target }}
      CPU: ${{ matrix.cpu }}
      TOOLCHAIN_SHA256: ${{ matrix.sha256 }}
      BOOTSTRAP_VERSION: 0.18.0-dev.92+1e1964473
    steps:
      - name: Download compiler source and pinned bootstrap toolchain
        shell: bash
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin https://forge.bc3.moe/bob/zig-nvptx.git
          git -C source fetch --depth=1 origin "$SOURCE_REVISION"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_REVISION"

          name="zig+llvm+lld+clang-$TARGET-$BOOTSTRAP_VERSION"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/$name.tar.xz" \
            "https://ziglang.org/deps/$name.tar.xz"
          echo "$TOOLCHAIN_SHA256  $RUNNER_TEMP/$name.tar.xz" | shasum -a 256 -c -
          tar -xf "$RUNNER_TEMP/$name.tar.xz" -C "$RUNNER_TEMP"
          rm "$RUNNER_TEMP/$name.tar.xz"

      - name: Build and package the compiler and library
        shell: bash
        run: |
          set -euo pipefail
          cd source
          toolchain="$RUNNER_TEMP/zig+llvm+lld+clang-$TARGET-$BOOTSTRAP_VERSION"
          dist="zig-nvptx-$TARGET-$CPU"
          version=$(python3 -c 'import re,sys; s=open("build.zig").read(); m=re.search(r"const zig_version: std.SemanticVersion = .\{ .major = (\d+), .minor = (\d+), .patch = (\d+) \};", s); assert m; print(".".join(m.groups()) + "-dev.0+" + sys.argv[1][:9])' "$SOURCE_REVISION")
          export ZIG_GLOBAL_CACHE_DIR="$RUNNER_TEMP/zig-global-cache"
          export ZIG_LOCAL_CACHE_DIR="$RUNNER_TEMP/zig-local-cache"
          "$toolchain/bin/zig" build --zig-lib="$PWD/lib" \
            --prefix "$RUNNER_TEMP/$dist" --search-prefix "$toolchain" \
            -Dtarget="$TARGET" -Dcpu="$CPU" -Doptimize=ReleaseFast \
            -Dstatic-llvm -Duse-zig-libcxx -Dflat -Dno-langref -Dstrip \
            -Dversion-string="$version" -j2
          cp LICENSE README.md "$RUNNER_TEMP/$dist/"
          test -f "$RUNNER_TEMP/$dist/lib/std/std.zig"
          tar -C "$RUNNER_TEMP" -cJf "$GITHUB_WORKSPACE/$dist.tar.xz" "$dist"

      - name: Smoke test the relocated package
        shell: bash
        run: |
          set -euo pipefail
          dist="zig-nvptx-$TARGET-$CPU"
          mkdir -p "$RUNNER_TEMP/smoke"
          tar -xf "$GITHUB_WORKSPACE/$dist.tar.xz" -C "$RUNNER_TEMP/smoke"
          zig="$RUNNER_TEMP/smoke/$dist/zig"
          unset ZIG_LIB_DIR
          "$zig" version
          printf '%s\n' 'const std = @import("std");' \
            'pub fn main() void { std.debug.assert(std.mem.eql(u8, "zig", "zig")); }' \
            > "$RUNNER_TEMP/smoke/host.zig"
          "$zig" build-exe "$RUNNER_TEMP/smoke/host.zig" -fllvm -femit-bin="$RUNNER_TEMP/smoke/host"
          "$RUNNER_TEMP/smoke/host"
          printf '%s\n' 'export fn kernel(out: *u32) callconv(.kernel) void { out.* = 42; }' \
            > "$RUNNER_TEMP/smoke/kernel.zig"
          "$zig" build-exe "$RUNNER_TEMP/smoke/kernel.zig" -target nvptx64-cuda \
            -mcpu=sm_80 -femit-bin="$RUNNER_TEMP/smoke/kernel.ptx"
          grep -q '\.entry kernel' "$RUNNER_TEMP/smoke/kernel.ptx"

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zig-${{ matrix.target }}-${{ matrix.cpu }}
          path: zig-nvptx-${{ matrix.target }}-${{ matrix.cpu }}.tar.xz
          if-no-files-found: error
          compression-level: 0

  release:
    needs: [source, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_REVISION: ${{ needs.source.outputs.revision }}
      FORGEJO_SSH_KEY: ${{ secrets.FORGEJO_RELEASE_SSH_KEY }}
      FORGEJO_HOST_KEY: ${{ vars.FORGEJO_SSH_HOST_KEY }}
    steps:
      - name: Download packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: zig-*
          merge-multiple: true
          path: packages

      - name: Publish release
        shell: bash
        run: |
          set -euo pipefail
          linux=zig-nvptx-x86_64-linux-musl-x86_64_v3.tar.xz
          macos=zig-nvptx-aarch64-macos-none-apple_m1.tar.xz
          test -s "packages/$linux"
          test -s "packages/$macos"
          (cd packages && sha256sum "$linux" "$macos" > SHA256SUMS)

          test -n "$FORGEJO_SSH_KEY"
          test -n "$FORGEJO_HOST_KEY"
          mkdir -p "$RUNNER_TEMP/ssh"
          chmod 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$FORGEJO_SSH_KEY" > "$RUNNER_TEMP/ssh/key"
          printf '%s\n' "$FORGEJO_HOST_KEY" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/key"
          trap 'rm -f "$RUNNER_TEMP/ssh/key"' EXIT
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/ssh/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts"
          tag="nvptx-build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git init release-tag
          git -C release-tag fetch --depth=1 https://forge.bc3.moe/bob/zig-nvptx-test.git "$GITHUB_SHA"
          test "$(git -C release-tag rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git -C release-tag tag "$tag" FETCH_HEAD
          git -C release-tag push ssh://git@ssh.forge.bc3.moe/bob/zig-nvptx-test.git "refs/tags/$tag"

          gh release create "$tag" "packages/$linux" "packages/$macos" packages/SHA256SUMS \
            --target "$GITHUB_SHA" --prerelease --title "Zig NVPTX build $GITHUB_RUN_ID" \
            --notes "Compiler source: https://forge.bc3.moe/bob/zig-nvptx/commit/$SOURCE_REVISION
          Bootstrap: Zig 0.18.0-dev.92+1e1964473 with LLVM, Clang and LLD.
          Each archive contains the compiler and its complete lib directory."
